<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DA StudyBuddies</title>
  <style>
    :root {
      --primary: #003366;
      --secondary: #d97706;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    header { background-color: var(--primary); color: white; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    
    .container { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid var(--bg); padding-bottom: 5px; }
    
    form { display: grid; gap: 10px; margin-bottom: 10px; }
    input, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { background-color: var(--primary); color: white; font-weight: bold; cursor: pointer; border: none; }
    button:hover { opacity: 0.9; }
    
    .admin-btn { background-color: var(--secondary); margin-top: 10px; }
    .hidden { display: none; }
    .list-item { background: #eef2ff; padding: 10px; border-left: 4px solid var(--primary); margin-bottom: 8px; border-radius: 4px; }
    .match-item { background: #ecfdf5; border-left-color: #10b981; }
  </style>
</head>
<body>

  <header>
    <h1>DA StudyBuddies</h1>
    <p>Connecting Student Tutors with Younger Learners at Dakar Academy</p>
  </header>

  <div class="container">
    <!-- Tutor Registration Form -->
    <div class="card">
      <h2>Become a Tutor</h2>
      <form id="tutorForm">
        <input type="text" id="tutorName" placeholder="Tutor Full Name" required />
        <input type="email" id="tutorEmail" placeholder="Dakar Academy Email (@dakar-academy.org)" required />
        <input type="text" id="tutorSubjects" placeholder="Subjects You Can Tutor (e.g. Math, French, Science)" required />
        <button type="submit">Register as Tutor</button>
      </form>
    </div>

    <!-- Parent Request Form -->
    <div class="card">
      <h2>Request a Tutor (Parents)</h2>
      <form id="parentForm">
        <input type="text" id="parentName" placeholder="Parent Full Name" required />
        <input type="text" id="studentGrade" placeholder="Student Grade Level" required />
        <input type="text" id="subjectNeeded" placeholder="Subject Needed" required />
        <button type="submit">Submit Request</button>
      </form>
    </div>

    <!-- Admin Section -->
    <div class="card">
      <h2>Admin Dashboard</h2>
      <div id="adminAuth">
        <input type="password" id="adminPassword" placeholder="Enter Admin Password" />
        <button type="button" class="admin-btn" id="loginBtn">Log In as Admin</button>
      </div>

      <div id="adminPanel" class="hidden">
        <button type="button" id="matchBtn" style="background-color: #10b981; margin-bottom: 15px;">Run Auto-Match Algorithm</button>
        
        <h3>Registered Tutors</h3>
        <div id="tutorsList">Loading...</div>

        <h3 style="margin-top: 15px;">Pending Parent Requests</h3>
        <div id="requestsList">Loading...</div>

        <h3 style="margin-top: 15px;">Successful Matches</h3>
        <div id="matchesList">None yet</div>
      </div>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      deleteDoc, 
      doc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYffPQM8hUumIHY5LKymgUpPt1m9pQ0I8",
      authDomain: "da-studybuddies.firebaseapp.com",
      projectId: "da-studybuddies",
      storageBucket: "da-studybuddies.appspot.com",
      messagingSenderId: "1071279818817",
      appId: "1:1071279818817:web:2a832f91a5db4b14d245da"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.dbTools = { collection, addDoc, getDocs, deleteDoc, doc, onSnapshot };
  </script>

  <!-- Main Logic Script -->
  <script src="codethree.js"></script>
</body>
</html>
